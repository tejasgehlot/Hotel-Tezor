<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Tezor | Your Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 class="hotel-title">HOTEL TEZOR</h1>
        <p>Almost There: Confirm Your Reservation</p>
        <nav><a href="index.html">Book a Room</a> <a href="admin.html">Admin</a></nav>
    </header>

    <div class="container">

        <!-- Stay summary (later: filled by the servlet/JSP) -->
        <div class="summary-box">
            <span><strong>Room:</strong> 123 (Double)</span>
            <span><strong>Check-In:</strong> 2026-11-04</span>
            <span><strong>Check-Out:</strong> 2026-11-06</span>
            <span><strong>Guests:</strong> 2</span>
            <span><strong>Total:</strong> ₹5,000.00</span>
        </div>

        <div class="booking-card">
            <h2 class="card-title">Step 3: Your Details</h2>
            <p class="hint">No payment needed now. Payment is collected at the hotel.</p>

            <form action="confirm-booking" method="POST">

                <!-- Carried over from the previous step. The total is NOT sent: the server recalculates it. -->
                <input type="hidden" name="room_id" value="1">
                <input type="hidden" name="check_in" value="2026-11-04">
                <input type="hidden" name="check_out" value="2026-11-06">
                <input type="hidden" name="guests" value="2">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" placeholder="Harry Yasher" maxlength="100" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="7878787878" pattern="[0-9+]{10,15}" title="10 to 15 digits" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address (optional)</label>
                        <input type="email" id="email" name="email" placeholder="harry@example.com" maxlength="100">
                    </div>
                </div>

                <button type="submit" class="btn-submit">Confirm Reservation</button>
            </form>
        </div>
    </div>

</body>
</html>
